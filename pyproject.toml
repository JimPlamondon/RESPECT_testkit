[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "RESPECT-testkit"
version = "0.1.0"
description = "Standalone RESPECT Compatible Test Suite and RESPECT-ification Kit"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{name = "Jim Plamondon"}]
dependencies = [
  "cryptography>=45.0",
  "importlib-resources>=6.1",
  "jsonschema>=4.25.1",
]

[project.optional-dependencies]
test = [
  "build>=1.2",
  "pytest>=8.4",
]

[project.scripts]
respect-compat = "respect_compat.cli:main"
respect-ification = "respect_ification.cli:main"
respect-matrix-validate = "respect_compat.matrix_validator:main"
respect-standards-bootstrap = "respect_compat.standards_bootstrap:main"
respect-runtime-driver-build = "respect_compat.runtime_driver_build:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
respect_compat = [
  "data/indexes/*.json",
  "data/android/**/*",
  "data/matrix/*.json",
  "data/profiles/*.json",
  "data/schemas/*.json",
  "data/fixtures/**/*",
]
respect_ification = ["data/publication/*.json", "data/schemas/*.json"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
